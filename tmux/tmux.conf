# Basic quality-of-life settings
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# True color passthrough — without this, tmux mangles colors for
# true-color themes like nordic.nvim even though nvim thinks it's fine.
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"

# Prefix: Ctrl-t instead of the default Ctrl-b
set -g prefix C-t
unbind C-b
bind C-t send-prefix

# Intuitive split keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind s split-window -h -c "#{pane_current_path}"
bind n new-window -c "#{pane_current_path}"
bind q kill-window

# Seamless Ctrl-hjkl navigation between tmux panes and nvim splits
# (nvim side: smart-splits.nvim). Falls through to nvim when it's the
# active pane, otherwise moves between tmux panes directly.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"

bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Jump to window N, or create it if it doesn't exist yet. No prefix needed.
# Alt (not Ctrl) because Ctrl+digit has no standard terminal encoding and
# won't reliably reach tmux across terminals/OSes; Alt+key always sends
# ESC+key, which every terminal (Linux and Windows) handles natively.
bind-key -n M-1 if-shell "tmux list-windows -F '##I' | grep -qx 1" "select-window -t 1" "new-window -t 1"
bind-key -n M-2 if-shell "tmux list-windows -F '##I' | grep -qx 2" "select-window -t 2" "new-window -t 2"
bind-key -n M-3 if-shell "tmux list-windows -F '##I' | grep -qx 3" "select-window -t 3" "new-window -t 3"
bind-key -n M-4 if-shell "tmux list-windows -F '##I' | grep -qx 4" "select-window -t 4" "new-window -t 4"
bind-key -n M-5 if-shell "tmux list-windows -F '##I' | grep -qx 5" "select-window -t 5" "new-window -t 5"
bind-key -n M-6 if-shell "tmux list-windows -F '##I' | grep -qx 6" "select-window -t 6" "new-window -t 6"
bind-key -n M-7 if-shell "tmux list-windows -F '##I' | grep -qx 7" "select-window -t 7" "new-window -t 7"
bind-key -n M-8 if-shell "tmux list-windows -F '##I' | grep -qx 8" "select-window -t 8" "new-window -t 8"
bind-key -n M-9 if-shell "tmux list-windows -F '##I' | grep -qx 9" "select-window -t 9" "new-window -t 9"
